# Consumables sentence templates for Home Assistant's built-in intent matcher.
#
# Installed automatically into <config>/custom_sentences/en/ when the integration
# sets up. Do not edit here — this is a copy of ha/custom_sentences/en/consumables.yaml
# in the Consumables server repo, minus the Heat2Eat intents, which are omitted
# because intents.py registers no handlers for them. Add the handlers first, then
# the sentences; a matched intent with no handler is an error spoken at the user.
#
# These handle the formulaic bulk of voice traffic with no LLM in the loop: matching
# happens on the HA host, offline, in about a millisecond, and costs nothing. Only
# phrasings that miss here fall through to the conversation agent.
#
# Three things to know about the phrasing choices:
#
#   * The item name is a wildcard, so no vocabulary is synced into HA. Whatever the
#     speech-to-text produced is posted verbatim and resolved server-side, where the
#     tenant's item names and aliases actually live.
#
#   * These sentences assume Home Assistant's own list entity is NOT exposed to
#     Assist. Its built-in HassListAddItem intent claims "add X" and "add X to the
#     shopping list", and priority between custom and built-in sentences is fragile,
#     so leaving both on makes those phrasings a coin flip. Turn `todo.shopping_list`
#     off under Settings -> Voice assistants -> Expose (the HACS README walks
#     through it). With it off, bare "add X" is ours and goes on the shopping list,
#     which is the behaviour people already have muscle memory for; "add X to the
#     pantry" still means the inventory.
#
#   * hassil syntax: (a|b) is a required choice, [x] is optional. `(x )?` is NOT
#     optional-group syntax — it silently fails to match. Contractions must be
#     whole-token alternatives too: `what ('s|is)` needs a literal space in the
#     utterance, so write `(what's|what is)`. Both mistakes fail silently — run
#     `apps/inventory/tests/test_sentences.py` in the server repo after editing.

language: "en"

lists:
  # Free text — the server resolves it against Item.name and Item.aliases.
  # NOT called `name`: Home Assistant reserves that slot for its own list of
  # exposed entity names and silently overrides a wildcard declared here, so
  # every `{name}` sentence stopped matching groceries and answered "I am not
  # aware of any device called eggs". `item` is what HA's own list intents use.
  item:
    wildcard: true
  delta:
    range:
      from: 1
      to: 99

  # Where a household keeps things, for answering "where does it live?" after
  # adding something new. Deliberately NOT the `location` list above: <cold_slot>
  # uses that one to tell a cooked dish going in the freezer from groceries going in
  # the pantry, and widening it would turn "put the chili in the pantry" into a dish.
  storage:
    values:
      - "fridge"
      - "refrigerator"
      - "freezer"
      - "deep freeze"
      - "pantry"
      - "larder"
      - "kitchen"
      - "bathroom"
      - "laundry"
      - "garage"
      - "basement"
      - "cupboard"
      - "cabinet"

  # Captured so "put the chili in the freezer" records where it went. Matched
  # server-side against the household's own Location rows, so a household that
  # calls it "pantry freezer" still resolves from the spoken "freezer".
  location:
    values:
      - "fridge"
      - "refrigerator"
      - "freezer"
      - "deep freeze"

expansion_rules:
  # Where a household keeps consumables. Several spellings keep the disambiguator
  # from feeling like a magic word.
  store: "[(the|our) ](pantry|inventory|supplies|stock|store cupboard)"
  # Everything a person says between the verb and the thing itself: an article, a
  # partitive ("the last of the"), or a container ("a bottle of"). Every part is
  # optional, so it costs nothing when they say none of it. Without this the
  # wildcard swallows the lot and the server is asked to resolve "of the dish
  # soap" or "the milk" — the same trap the explicit [more ] below avoids, which
  # is why that one is now folded in here.
  det: >-
    [(a|an|one|another|some|more|the) ][(last|rest) ][of ][(the|our) ][(bag|bags|bar|bars|block|blocks|bottle|bottles|box|boxes|can|cans|carton|cartons|case|cases|container|containers|crate|crates|cup|cups|jar|jars|jug|jugs|loaf|loaves|pack|packs|packet|packets|pot|pots|punnet|punnets|roll|rolls|sachet|sachets|sack|sacks|stick|sticks|tin|tins|tray|trays|tub|tubs|tube|tubes) of ][(the|our) ]
  shopping_list: "[(the|our) ](shopping|grocery) list"

  cold_slot: "[(the|our) ]{location}"
  portions: "(portion|portions|serving|servings|container|containers)"
  mealprep: "(meal prep|mealprep|meal-prep|meal preps|prepped meals|freezer meals)"
  leftovers: "(leftover|leftovers|dish|dishes|meal|meals)"

intents:
  AddConsumable:
    data:
      # With an explicit count: "add 3 paper towels to the pantry"
      - sentences:
          - "(add|put) {delta} <det>{item} (to|in|into) <store>"
          - "[(I|we) ][just ](bought|picked up|got|have) {delta} <det>{item}"
      # Without one — assume a single unit.
      - sentences:
          - "(add|put) <det>{item} (to|in|into) <store>"
          - "[(I|we) ][just ](bought|picked up|got) <det>{item}"
          - "(restock|refill|replenish) <det>{item}"
        slots:
          delta: 1

  RemoveConsumable:
    data:
      - sentences:
          # "[(I|we) ][just ]" has to be here as well as on the uncounted rule
          # below: without it "we used 2 sticks of butter" fell through to that
          # one, which carries no {delta}, and the count vanished into the
          # wildcard as name="2 sticks of butter".
          - "[(I|we) ][just ](remove[d]|take|took|use[d]|open[ed]|finish[ed]) {delta} <det>{item}"
          - "(remove|take) {delta} <det>{item} (from|out of) <store>"
      - sentences:
          - "[(I|we) ][just ](used|took|opened|finished) <det>{item}"
          - "(remove|take) <det>{item} (from|out of) <store>"
        slots:
          delta: 1

  SetConsumableState:
    data:
      # "we're out of dish soap" — the highest-value phrasing, and the one people
      # actually say at the moment they notice something has run out.
      - sentences:
          - "(we're|we are|we've|we have|I'm|I am) [all ]out of {item}"
          - "(we|I) (ran|have run) out of {item}"
          - "(there's|there is) no {item} (left|remaining)"
          - "{item} (is|are) [all ](gone|out|empty|finished)"
        slots:
          state: "out"
      - sentences:
          - "(we're|we are|we|I'm|I am|I) [(running|getting) ]low on {item}"
          - "(we're|we are) almost out of {item}"
          - "{item} (is|are) [(running|getting) ]low"
        slots:
          state: "low"
      - sentences:
          - "(we're|we are) (stocked up on|fine for|good for) {item}"
          - "{item} (is|are) (restocked|back in stock|fine|full)"
        slots:
          state: "in_stock"

  QueryConsumable:
    data:
      - sentences:
          - "how (much|many) {item} (do we|do I|have we|have I) (have|got)[ left]"
          - "how (much|many) {item} (is|are) (there|left)"
          - "(do|have) (we|I) (have|got) [(any|enough) ]{item}"
          - "(what's|what is) (our|the) {item} (count|level|stock)"
          - "are we out of {item}"

  # "Where is the butter?" — a different question from "how much butter", with a
  # different answer, so a separate intent rather than making every stock reply
  # recite a location nobody asked for. Anchored on "where", which no other
  # sentence here starts with, so there is nothing for it to collide with.
  WhereConsumable:
    data:
      - sentences:
          - "where (is|are) <det>{item}"
          - "(where's|wheres) <det>{item}"
          - "where (do|does) (we|I) (keep|store|put) <det>{item}"
          - "where (is|are) <det>{item} (kept|stored|normally kept)"
          - "(which|what) (shelf|cupboard|location) (is|are) <det>{item} (in|on)"

  ListLowStock:
    data:
      - sentences:
          - "what (are we|am I|do we|do I) [running ]low on"
          - "(what's|what is|what are) [(running|getting) ]low"
          - "what (do|should) (we|I) need to (buy|get|restock|reorder)"
          - "(what's|what is) [(on|in) ]<store> (running low|low)"
          - "(anything|what) [do ](we|I) need (to buy|from the (shop|shops|store))"

  ListShopping:
    data:
      - sentences:
          - "(what's|what is) [(on|in) ]<shopping_list>"

  CheckOffShopping:
    data:
      - sentences:
          # "bought/picked up {item}" is already AddConsumable's — these phrasings are
          # deliberately different so the two intents can't collide.
          - "check off {item}"
          - "(cross|tick) {item} off <shopping_list>"
          - "mark {item} as bought"

  # Bare "(add|put) {item}" has no trailing anchor, so on its own it matches "put the
  # lasagne in the fridge" with item="lasagne in the fridge". What saves it is the
  # matcher, not the ordering: HA's default agent calls hassil's recognize_best
  # (see homeassistant/components/conversation/default_agent.py), which prefers the
  # sentence matching the most literal text and so picks the anchored phrasing every
  # time. Plain recognize() gets these wrong, which is why the test uses the same
  # call HA makes. Declared last anyway — it costs nothing and keeps the greedy rule
  # out of the way of any matcher that does walk in order.
  AddToShoppingList:
    data:
      # With an explicit count: "put 3 milk on the shopping list", "we need 2 milk"
      - sentences:
          - "put {delta} <det>{item} on <shopping_list>"
          - "(add|put) {delta} <det>{item}"
          - "(we|I) need {delta} <det>{item}"
      # Without one — assume a single unit.
      - sentences:
          - "put <det>{item} on <shopping_list>"
          - "add <det>{item} to <shopping_list>"
          # Bare "add milk" — ours only because HA's list entity is unexposed. The
          # anchored phrasings sit above it so they win inside this intent too.
          - "(add|put) <det>{item}"
          - "(we|I) need <det>{item}"
        slots:
          delta: 1

  # Answering the question a new item asks. Anchored on a storage word so it cannot
  # swallow an ordinary sentence, and the server ignores it unless a question is
  # genuinely open — "the fridge" said out of nowhere is answered "I wasn't asking
  # anything" rather than filing something. Declared last for the same reason
  # AddToShoppingList is: its bare form has no trailing anchor.
  AnswerLocation:
    data:
      - sentences:
          - "[it ](goes|lives|belongs) [in ][(the|our) ]{storage}"
          - "(in|on|under|inside) [(the|our) ]{storage}"
          - "[(the|our) ]{storage}"

  # Dishes — leftovers and meal prep. Every phrasing here is one no consumables
  # intent can also claim — "we got some chili left over" would match
  # AddConsumable's "we got some {item}" with name="chili left over", so it is
  # deliberately absent and left to the LLM, which disambiguates it correctly.
  # Templates take only the unambiguous traffic.
  #
  # `kind` is a fixed slot, not a captured one: the sentence decides which list a
  # phrasing means. Leaving it off means leftovers, which is what all of this
  # meant before meal prep existed.
  AddDish:
    data:
      # Meal prep first — its rules are the anchored ones ("as meal prep", "for
      # meal prep"), and an anchored sentence must not be shadowed by the bare
      # leftovers rule that matches less literal text.
      - sentences:
          - "(put|add|save) {delta} <portions> of {item} (in|into|to) <cold_slot> (as|for) <mealprep>"
          - "(put|add|save) {delta} <portions> (in|into|to) <cold_slot> of {item} (as|for) <mealprep>"
          - "(put|add|save) {delta} <portions> of {item} (as|for) <mealprep>"
        slots:
          kind: "mealprep"
      - sentences:
          - "(put|add|save) <det>{item} (in|into|to) <cold_slot> (as|for) <mealprep>"
          - "(put|add|save) <det>{item} (as|for) <mealprep>"
        slots:
          kind: "mealprep"
          delta: 1
      # Leftovers, with an explicit portion count: "put 3 portions of chili in the fridge"
      - sentences:
          - "(put|add|save) {delta} <portions> of {item} (in|into|to) <cold_slot>"
          - "(put|add|save) {delta} <portions> (in|into|to) <cold_slot> of {item}"
          - "(we|I) (made|cooked) {delta} <portions> of {item}"
        slots:
          kind: "leftovers"
      # Without one — assume a single portion.
      - sentences:
          - "(put|add|save) <det>{item} (in|into|to) <cold_slot>"
          - "(put|save) <det>leftover {item} away"
          - "(there's|there is) [some ]{item} left over"
          - "(we|I) (have|made) [some ]{item} left over"
        slots:
          kind: "leftovers"
          delta: 1

  # Eating usually takes no kind: someone taking a serving out says what it is,
  # not which list it is on, and the server then checks leftovers before meal prep
  # — the portions on a clock go first. These rules exist so a speaker *can* say
  # which, either by naming the list or by naming the cold storage that stands for
  # it, which the server reads off the words in ``services.kind_named``.
  #
  # Qualified rules are declared first. They carry a trailing anchor and so match
  # more literal text, which is what recognize_best prefers — but declaration
  # order costs nothing and keeps them right under any matcher.
  EatDish:
    data:
      # Naming the storage. {location} is captured rather than baked into a rule
      # per word, so "fridge" and "deep freeze" stay defined in one place.
      - sentences:
          - "(we|I) ate {delta} <portions> of <det>{item} (from|out of) <cold_slot>"
          - "(take|taking|took) out {delta} <portions> of <det>{item} (from|out of) <cold_slot>"
      - sentences:
          - "(we|I) (ate|had) <det>{item} (from|out of) <cold_slot>"
          # "took the chili out of the freezer" was left to the LLM while it was a
          # bare rule, because RemoveConsumable's "[I|we] [just] took {item}" also
          # matches it and the winner depended on the matcher. The trailing
          # <cold_slot> settles it: this matches strictly more literal text, which
          # is what HA's recognize_best takes — and test_sentences.py calls
          # recognize_best exactly as HA does, so the behaviour is pinned, not bet on.
          - "(take|taking|took) <det>{item} (out of|from) <cold_slot>"
        slots:
          delta: 1
      # Naming the list itself.
      - sentences:
          - "(we|I) (ate|had) <det>leftover {item}"
        slots:
          kind: "leftovers"
          delta: 1
      - sentences:
          - "(we|I) (ate|had) <det>{item} (from|out of) [(the|our) ]<mealprep>"
          - "(take|taking|took) <det>{item} (out of|from) [(the|our) ]<mealprep>"
        slots:
          kind: "mealprep"
          delta: 1
      # Unqualified — leftovers first, then meal prep.
      - sentences:
          - "(we|I) ate {delta} <portions> of <det>{item}"
          # "taking out 1 serving of lasagne". Safe against RemoveConsumable's
          # "(remove|take) {delta} <det>{item}" because the literal "out" sits
          # where that rule wants a number.
          - "(take|taking|took) out {delta} <portions> of <det>{item}"
      - sentences:
          # "ate/had" only — RemoveConsumable already owns "used/took/finished",
          # and a phrasing both intents match is a coin flip at runtime.
          - "(we|I) (ate|had) <det>{item}"
        slots:
          delta: 1

  ListDish:
    data:
      # "What should we eat first?" — the oldest one, not the whole list. Its own
      # scope rather than its own intent: same question, same list, different depth
      # of answer, and a second intent would need its own script and handler to say
      # a sentence services already composes.
      - sentences:
          - "(what's|whats|what is) the oldest <leftovers>"
          # No noun at all — the question somebody actually asks at an open
          # fridge. It means leftovers: nobody stands there wondering which
          # frozen meal to defrost first.
          - "what (should|do) (we|I) (eat|use|finish|have) first"
          - "(what's|whats|what is) the oldest thing in [(the|our) ](fridge|refrigerator)"
          - "(what|which) <leftovers> (should|do) (we|I) (eat|use|finish) first"
          - "what needs (eating|using up|finishing)[ first]"
          - "(what's|whats|what is) going off"
        slots:
          kind: "leftovers"
          scope: "oldest"
      - sentences:
          - "(what's|whats|what is) the oldest <mealprep>"
          - "(what's|whats|what is) the oldest thing in [(the|our) ](freezer|deep freeze)"
          - "(what|which) <mealprep> (should|do) (we|I) (eat|use|finish) first"
        slots:
          kind: "mealprep"
          scope: "oldest"
      # The freezer belongs to meal prep now, so "what's in the freezer" asks that
      # list. Leftovers keep the fridge. A leftover frozen for next week is on the
      # meal prep page's clock either way, so nothing is hidden by this.
      - sentences:
          - "(what's|what is|what are) [(in|left in) ][(the|our) ](freezer|deep freeze)"
          - "(what|which) <mealprep> (do we|do I|have we|have I) (have|got)"
          - "(what's|what is) [(in|left in) ]<mealprep>"
        slots:
          kind: "mealprep"
      - sentences:
          - "(what's|what is|what are) [(in|left in) ][(the|our) ](fridge|refrigerator)"
          - "(what|which) leftovers (do we|do I|have we|have I) (have|got)"
          - "(what's|what is) for (dinner|lunch|tea)"
          - "how old (is|are) the leftovers"
        slots:
          kind: "leftovers"
